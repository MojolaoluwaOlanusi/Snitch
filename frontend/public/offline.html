<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snitch – Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #a0aec0;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .retry-btn {
            display: inline-block;
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .retry-btn:hover {
            background: #4f46e5;
        }
        .retry-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
        Snitch needs an internet connection to load.<br />
        Please check your connection and try again.
    </p>
    <button class="retry-btn" onclick="location.reload()">Retry</button>
</div>
</body>
</html>
